spring.application.name=stuff
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:stuff_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}
blizzard.oauth.token-url=${BLIZZARD_OAUTH_TOKEN_URL:https://oauth.battle.net/token}
blizzard.api.base-url=${BLIZZARD_API_BASE_URL:https://us.api.blizzard.com}
blizzard.api.classic-era-namespace=${BLIZZARD_CLASSIC_ERA_NAMESPACE:static-classic-us}
blizzard.api.locale=${BLIZZARD_API_LOCALE:en_US}
blizzard.client-id=${BLIZZARD_CLIENT_ID}
blizzard.client-secret=${BLIZZARD_CLIENT_SECRET}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
